<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteX | Notes and checklists</title>
    <meta name="description" content="A fast notes and checklist app that saves everything in your browser." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved or system theme before React loads, so the page doesn't flash.
      try {
        const saved = JSON.parse(localStorage.getItem('notex:theme'))
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
